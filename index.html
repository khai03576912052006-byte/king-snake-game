<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KING SNAKE - 10 LEVEL AUTO AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#24365f,#080d1d 65%);font-family:Arial,sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px}.wrap{width:min(100%,1000px)}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px;flex-wrap:wrap}h1{font-size:clamp(19px,4vw,30px);margin:0;color:#ffe27a;text-shadow:0 0 18px #ff9c3c}header small{color:#b9c8ef}.stage{position:relative;border:2px solid #7ce7d8;border-radius:16px;overflow:hidden;box-shadow:0 0 35px #20d5c355;background:#101a32}canvas{display:block;width:100%;height:auto;aspect-ratio:900/650;touch-action:none}.overlay{position:absolute;inset:0;z-index:10;pointer-events:auto;background:#05091bd9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.panel{max-width:520px}.panel h2{font-size:clamp(28px,6vw,48px);margin:0 0 12px;color:#ffdf67}.panel p{line-height:1.55;color:#e3eaff}.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}.btn{position:relative;z-index:5;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:1px solid #6be2d0;background:linear-gradient(135deg,#153d59,#22295a);color:white;border-radius:10px;padding:10px 15px;font-weight:bold;cursor:pointer}.btn:hover{filter:brightness(1.3)}.pad{display:none;grid-template-columns:repeat(3,48px);gap:5px;justify-content:center;margin:12px auto}.pad button{height:42px;font-size:18px}.help{text-align:center;color:#bdc9e8;font-size:13px;line-height:1.6;margin-top:10px}@media(max-width:650px){body{padding:6px}.pad{display:grid}.help{font-size:12px}}
</style></head><body><main class="wrap"><header><div><h1>🐍 KING SNAKE</h1><small>10 màn chơi • AUTO AI • Nhạc chiptune</small></div><small>Người chơi: HKHẢI</small></header>
<div class="stage"><canvas id="game" width="900" height="650"></canvas><div id="overlay" class="overlay"><div class="panel"><h2>KING SNAKE</h2><p>Chinh phục 10 thế giới, ăn đủ mồi để mở màn tiếp theo. Có thể tự điều khiển hoặc bật AI tự tìm đường.</p><div class="controls"><button class="btn" id="start">▶ BẮT ĐẦU</button><button class="btn" id="autoStart">🤖 CHƠI TỰ ĐỘNG</button></div></div></div></div>
<div class="pad"><span></span><button class="btn" data-dir="0,-1">▲</button><span></span><button class="btn" data-dir="-1,0">◀</button><button class="btn" data-dir="0,1">▼</button><button class="btn" data-dir="1,0">▶</button></div>
<div class="controls"><button class="btn" id="auto">🤖 AUTO: OFF (M)</button><button class="btn" id="music">♫ NHẠC: ON (N)</button><button class="btn" id="restart">↻ CHƠI LẠI (R)</button></div><div class="help">Bàn phím: ↑ ↓ ← → hoặc W A S D để di chuyển • M bật/tắt AI • N bật/tắt nhạc • R chơi lại • ESC tạm dừng</div></main>
<script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=900,H=650,C=25,MINX=1,MAXX=34,MINY=5,MAXY=24;
const themes=[
['RỪNG XANH','#32af69','#0c5546','#ffdc46','#ff7850','#fffac0','#ff5a96','#146428','#64e65a','🌿'],['SA MẠC LỬA','#ff9646','#963264','#ffd746','#ff5096','#fffab4','#50e6ff','#965a1e','#f0be46','🌵'],['VÙNG ĐỘC TỐI','#3e2464','#0e302a','#d264ff','#ff6edc','#f5c8ff','#6eff82','#371655','#96eb50','☠'],['HẦM LỬA','#d74137','#460f28','#ff8c32','#ffeb46','#ffe18c','#50e6ff','#4b160f','#ff7d28','🔥'],['RỪNG PHA LÊ','#28b4dc','#193c8c','#ff82dc','#aa82ff','#ffe1fa','#fff05a','#146e8c','#82fff0','💎'],['SA MẠC BÃO TỐ','#ebb946','#8c552d','#fff55a','#ff823c','#ffffc8','#ff3c82','#8c6428','#ebcd6e','🌪'],['MÊ CUNG BĂNG','#6eb4ff','#2d4baf','#ff82c8','#ffd75a','#fff','#ff963c','#4678aa','#e1f7ff','❄'],['THỬ THÁCH CUỐI','#7d2373','#190a37','#ff6ed2','#ffd25a','#ffdced','#78ffd2','#5a1464','#ff78dc','⚡'],['VƯƠNG QUỐC RẮN','#23b4aa','#194178','#ffaa46','#ff5f8c','#ffebb4','#fff578','#146e5a','#6effbe','🏰'],['KING SNAKE','#9650dc','#fa73a0','#ffc828','#ff50a0','#ffffc8','#50ffd2','#966414','#ffe15a','👑']];
const dirs=[[0,-1],[0,1],[-1,0],[1,0]];let snake,dir,next,level,score,eaten,obstacles,food,auto=false,playing=false,over=false,won=false,musicOn=true,last=0,acc=0,particles=[],audio=null,musicTimer=null;
const $=id=>document.getElementById(id),inside=p=>p[0]>=MINX&&p[0]<=MAXX&&p[1]>=MINY&&p[1]<=MAXY,eq=(a,b)=>a[0]===b[0]&&a[1]===b[1],key=p=>p[0]+','+p[1],target=()=>5+level*5,obCount=()=>5+level*2;
function tone(f,d=.1,type='square',vol=.035){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function startMusic(){if(!musicOn||musicTimer)return;let seq=[523,659,784,1046,784,659,587,784,880,1046,880,784],i=0;musicTimer=setInterval(()=>{if(musicOn&&playing)tone(seq[i++%seq.length],.16,'square',.012)},190)}function stopMusic(){clearInterval(musicTimer);musicTimer=null}function soundEat(){tone(900,.08);setTimeout(()=>tone(1400,.1),70)}
function reset(){level=0;score=0;eaten=0;snake=[[18,15],[17,15],[16,15]];dir=[1,0];next=[1,0];particles=[];over=false;won=false;obstacles=makeObstacles();food=makeFood();playing=true;acc=0;$('overlay').style.display='none';startMusic();draw()}
function makeObstacles(){let a=[],used=new Set(snake.map(key));while(a.length<obCount()){let p=[MINX+Math.floor(Math.random()*(MAXX-MINX+1)),MINY+Math.floor(Math.random()*(MAXY-MINY+1))];if(!used.has(key(p))&&Math.abs(p[0]-snake[0][0])+Math.abs(p[1]-snake[0][1])>4){a.push(p);used.add(key(p))}}return a}
function makeFood(){let free=[];for(let y=MINY;y<=MAXY;y++)for(let x=MINX;x<=MAXX;x++){let p=[x,y];if(!snake.some(s=>eq(s,p))&&!obstacles.some(o=>eq(o,p)))free.push(p)}return free.length?free[Math.floor(Math.random()*free.length)]:null}
function bfs(start,goal){if(!goal)return null;let block=new Set([...snake.slice(1,-1),...obstacles].map(key)),q=[start],parents=new Map([[key(start),null]]),moves=new Map();while(q.length){let p=q.shift();if(eq(p,goal))break;for(let d of dirs){let n=[p[0]+d[0],p[1]+d[1]],k=key(n);if(!inside(n)||block.has(k)||parents.has(k))continue;parents.set(k,key(p));moves.set(k,d);q.push(n)}}if(!parents.has(key(goal)))return null;let path=[],k=key(goal);while(parents.get(k)!==null){path.push(moves.get(k));k=parents.get(k)}return path.reverse()}
function aiMove(){let p=bfs(snake[0],food);if(p&&p.length)return p[0];p=bfs(snake[0],snake[snake.length-1]);if(p&&p.length)return p[0];let cand=dirs.map(d=>({d,p:[snake[0][0]+d[0],snake[0][1]+d[1]]})).filter(o=>inside(o.p)&&!obstacles.some(x=>eq(x,o.p))&&!snake.slice(0,-1).some(x=>eq(x,o.p)));cand.sort((a,b)=>dist(a.p,food)-dist(b.p,food));return cand[0]?.d||null}function dist(a,b){return b?Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]):0}
function move(){if(auto){let d=aiMove();if(!d){end(false);return}next=d}dir=next;let h=[snake[0][0]+dir[0],snake[0][1]+dir[1]];if(!inside(h)||snake.slice(0,-1).some(p=>eq(p,h))||obstacles.some(p=>eq(p,h))){end(false);return}snake.unshift(h);if(eq(h,food)){score+=10;eaten++;soundEat();for(let i=0;i<18;i++)particles.push({x:h[0]*C+12,y:h[1]*C+12,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:30,color:themes[level][5]});if(eaten>=target()){if(level===9){end(true);return}level++;eaten=0;obstacles=makeObstacles();food=makeFood();tone(1000,.3,'triangle',.05)}else food=makeFood()}else snake.pop()}
function end(win){over=true;won=win;playing=false;stopMusic();tone(win?1046:180,.6,'triangle',.05);$('overlay').style.display='flex';$('overlay').innerHTML='<div class="panel"><h2>'+(win?'🏆 CHIẾN THẮNG!':'GAME OVER')+'</h2><p>'+(win?'Bạn đã hoàn thành cả 10 màn chơi!':'Rắn đã va chạm. Hãy thử lại nhé!')+'<br>Tổng điểm: <b>'+score+'</b></p><div class="controls"><button class="btn" id="again">↻ CHƠI LẠI</button></div></div>';$('again').onclick=reset}
function rounded(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();if(typeof ctx.roundRect==='function'){ctx.roundRect(x,y,w,h,r)}else{ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y)}ctx.closePath();ctx.fill()}
function draw(){let t=themes[level],g=ctx.createLinearGradient(0,100,0,650);g.addColorStop(0,t[1]);g.addColorStop(1,t[2]);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#0d142c';ctx.fillRect(0,0,W,100);ctx.fillStyle='#fff';ctx.font='bold 38px Arial';ctx.textAlign='center';ctx.fillText('SNAKE ADVENTURE',450,42);ctx.font='bold 20px Arial';ctx.fillStyle='#ffe27a';ctx.fillText('MÀN '+(level+1)+'/10  '+t[0],205,77);ctx.fillStyle='#8cffb4';ctx.fillText('ĐIỂM: '+score,500,77);ctx.fillStyle='#ffb18d';ctx.fillText('MỒI: '+eaten+'/'+target(),710,77);rounded(18,88,864,6,3,'#3c4260');rounded(18,88,864*eaten/target(),6,3,t[3]);
ctx.save();ctx.strokeStyle='#ffffff24';ctx.lineWidth=1;for(let x=25;x<900;x+=25){ctx.beginPath();ctx.moveTo(x,100);ctx.lineTo(x,650);ctx.stroke()}for(let y=125;y<650;y+=25){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}ctx.restore();ctx.fillStyle=t[7];ctx.fillRect(0,100,900,25);ctx.fillRect(0,625,900,25);ctx.fillRect(0,100,25,550);ctx.fillRect(875,100,25,550);for(let i=0;i<100;i++){let x=(i*97)%900,y=i%2?108:633;ctx.strokeStyle=t[8];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y+12);ctx.lineTo(x+((i%3)-1)*5,y);ctx.stroke()}
ctx.save();ctx.beginPath();ctx.rect(25,125,850,500);ctx.clip();for(let i=0;i<35;i++){let x=(i*137+performance.now()*.018)%850+25,y=(i*83+performance.now()*.025)%500+125;ctx.fillStyle=t[5]+'88';ctx.beginPath();ctx.arc(x,y,1+i%3,0,Math.PI*2);ctx.fill()}ctx.restore();for(let p of obstacles){let px=p[0]*C,py=p[1]*C;rounded(px+2,py+2,21,21,6,t[7]);ctx.strokeStyle=t[8];ctx.lineWidth=2;ctx.strokeRect(px+5,py+5,15,15);ctx.fillStyle=t[8];ctx.font='15px Arial';ctx.textAlign='center';ctx.fillText(t[9],px+12,py+19)}
if(food){let x=food[0]*C+12,y=food[1]*C+12+Math.sin(performance.now()*.008)*2;ctx.shadowColor=t[5];ctx.shadowBlur=20;ctx.fillStyle=t[5];ctx.beginPath();ctx.arc(x,y,11,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;rounded(x-4,y-7,8,15,3,'#fff')}
snake.forEach((p,i)=>{let x=p[0]*C+12,y=p[1]*C+12;let col=level===9?'hsl('+(performance.now()*.08+i*15)%360+' 90% 60%)':i%2?t[3]:t[4];ctx.fillStyle='#17202a';ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+dir[0]*3-dir[1]*4,y+dir[1]*3+dir[0]*4,3,0,Math.PI*2);ctx.arc(x+dir[0]*3+dir[1]*4,y+dir[1]*3-dir[0]*4,3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#152033';ctx.beginPath();ctx.arc(x+dir[0]*4-dir[1]*4,y+dir[1]*4+dir[0]*4,1.5,0,Math.PI*2);ctx.arc(x+dir[0]*4+dir[1]*4,y+dir[1]*4-dir[0]*4,1.5,0,Math.PI*2);ctx.fill()});if(snake.length){ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.fillText('HKHẢI',snake[0][0]*C+12,snake[0][1]*C-3)}
particles.forEach(p=>{ctx.globalAlpha=p.life/30;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--});particles=particles.filter(p=>p.life>0);ctx.fillStyle='#fff';ctx.font='14px Arial';ctx.textAlign='left';ctx.fillText('AUTO AI: '+(auto?'ON':'OFF')+' (M)     NHẠC: '+(musicOn?'ON':'OFF')+' (N)',18,645)}
function frame(ts){let dt=Math.min(50,ts-last||16);last=ts;if(playing){acc+=dt;let speed=Math.min(20,8+level+Math.floor(eaten/3)*.3);if(acc>=1000/speed){acc=0;move()}}draw();requestAnimationFrame(frame)}function setDir(d){if(d[0]!==-dir[0]||d[1]!==-dir[1])next=d}function sync(){$('auto').textContent='🤖 AUTO: '+(auto?'ON':'OFF')+' (M)';$('music').textContent='♫ NHẠC: '+(musicOn?'ON':'OFF')+' (N)'}
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase(),d={'arrowup':[0,-1],w:[0,-1],'arrowdown':[0,1],s:[0,1],'arrowleft':[-1,0],a:[-1,0],'arrowright':[1,0],d:[1,0]}[k];if(d){e.preventDefault();auto=false;setDir(d);sync()}if(k==='m'){auto=!auto;sync()}if(k==='n'){musicOn=!musicOn;if(musicOn)startMusic();else stopMusic();sync()}if(k==='r')reset();if(k==='escape'&&playing){playing=false;stopMusic();$('overlay').style.display='flex';$('overlay').innerHTML='<div class="panel"><h2>TẠM DỪNG</h2><p>Nhấn tiếp tục để chơi tiếp.</p><button class="btn" id="resume">TIẾP TỤC</button></div>';$('resume').onclick=()=>{playing=true;$('overlay').style.display='none';startMusic()}}});
function beginGame(useAI){try{auto=useAI;reset();sync();}catch(err){console.error(err);$('overlay').style.display='flex';$('overlay').innerHTML='<div class="panel"><h2>LỖI KHỞI ĐỘNG</h2><p>'+String(err.message||err)+'</p><button class="btn" id="tryAgain">THỬ LẠI</button></div>';$('tryAgain').addEventListener('click',()=>beginGame(useAI));}}$('start').addEventListener('click',()=>beginGame(false));$('start').addEventListener('pointerup',e=>{e.preventDefault();beginGame(false)});$('autoStart').addEventListener('click',()=>beginGame(true));$('autoStart').addEventListener('pointerup',e=>{e.preventDefault();beginGame(true)});$('auto').onclick=()=>{auto=!auto;sync()};$('music').onclick=()=>{musicOn=!musicOn;if(musicOn)startMusic();else stopMusic();sync()};$('restart').onclick=reset;document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{auto=false;setDir(b.dataset.dir.split(',').map(Number));sync()});requestAnimationFrame(frame);
})();
</script></body></html>
