<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>KING SNAKE</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#263b69,#080d1c 70%);color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:12px}.wrap{width:min(960px,100%)}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}h1{margin:0;color:#ffe27a;font-size:clamp(22px,5vw,34px)}.sub{color:#bdc9e8;font-size:13px}.stage{position:relative;border:2px solid #65dfd0;border-radius:15px;overflow:hidden;box-shadow:0 0 28px #20d5c344;background:#101a32}canvas{width:100%;height:auto;display:block;aspect-ratio:900/650;touch-action:none}.overlay{position:absolute;inset:0;background:#05091bdc;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px}.panel{max-width:520px}.panel h2{font-size:clamp(30px,7vw,48px);color:#ffdf67;margin:0 0 10px}.panel p{line-height:1.5;color:#e4eaff}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #70e4d4;background:linear-gradient(135deg,#153d59,#28265e);color:white;border-radius:10px;padding:11px 15px;font-weight:bold;cursor:pointer;touch-action:manipulation;user-select:none}.btn:active{transform:scale(.97);filter:brightness(1.3)}.pad{display:none;grid-template-columns:repeat(3,52px);gap:5px;justify-content:center;margin:10px auto}.pad .btn{height:46px;padding:4px;font-size:20px}.help{text-align:center;color:#bdc9e8;font-size:13px;line-height:1.6;margin-top:9px}@media(max-width:650px){body{padding:5px}.pad{display:grid}.help{font-size:12px}}
</style></head><body><main class="wrap"><header><div><h1>🐍 KING SNAKE</h1><div class="sub">10 màn chơi • Điều khiển tay • AUTO AI • Nhạc</div></div><div class="sub">Người chơi: HKHẢI</div></header>
<div class="stage"><canvas id="game" width="900" height="650"></canvas><div class="overlay" id="overlay"><div class="panel"><h2>🐍 KING SNAKE</h2><p>Ăn đủ mồi để vượt qua 10 màn chơi. Dùng phím mũi tên hoặc WASD để điều khiển.</p><div class="controls"><button class="btn" id="start" type="button">▶ BẮT ĐẦU</button><button class="btn" id="autoStart" type="button">🤖 CHƠI TỰ ĐỘNG</button></div></div></div></div>
<div class="pad"><span></span><button class="btn" data-dir="0,-1">▲</button><span></span><button class="btn" data-dir="-1,0">◀</button><button class="btn" data-dir="0,1">▼</button><button class="btn" data-dir="1,0">▶</button></div>
<div class="controls"><button class="btn" id="auto">🤖 AUTO: OFF (M)</button><button class="btn" id="music">♫ NHẠC: OFF (N)</button><button class="btn" id="restart">↻ CHƠI LẠI (R)</button></div><div class="help">Bàn phím: ↑ ↓ ← → hoặc W A S D • M: bật/tắt AI • N: nhạc • R: chơi lại • ESC: tạm dừng</div></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay');
const COLS=34,ROWS=20,CELL=25,LEFT=25,TOP=125;
const themes=[
{name:'RỪNG XANH',bg:'#32af69',bg2:'#0c5546',snake:'#ffdc46',snake2:'#ff783c',head:'#fffac2',food:'#ff5a96',accent:'#c8ff78',ob:'🪵'},
{name:'SA MẠC LỬA',bg:'#ff9646',bg2:'#963264',snake:'#ffd746',snake2:'#ff5096',head:'#fff2b4',food:'#50e6ff',accent:'#ffbe46',ob:'🌵'},
{name:'VÙNG ĐỘC TỐI',bg:'#3e2464',bg2:'#0e302a',snake:'#d264ff',snake2:'#ff6edc',head:'#f5c8ff',food:'#6eff82',accent:'#96ff82',ob:'🍄'},
{name:'HẦM LỬA',bg:'#d74137',bg2:'#460f28',snake:'#ff8c32',snake2:'#ffeb46',head:'#ffe18c',food:'#50e6ff',accent:'#ffd246',ob:'🔥'},
{name:'RỪNG PHA LÊ',bg:'#28b4dc',bg2:'#193c8c',snake:'#ff82dc',snake2:'#aa82ff',head:'#ffe1fa',food:'#fff05a',accent:'#ffffff',ob:'💎'},
{name:'SA MẠC BÃO TỐ',bg:'#ebb946',bg2:'#8c552d',snake:'#fff55a',snake2:'#ff823c',head:'#ffffc8',food:'#ff3c82',accent:'#ffebaa',ob:'🪨'},
{name:'MÊ CUNG BĂNG',bg:'#6eb4ff',bg2:'#2d4baf',snake:'#ff82c8',snake2:'#ffd75a',head:'#ffffff',food:'#ff963c',accent:'#ffffff',ob:'❄️'},
{name:'THỬ THÁCH CUỐI',bg:'#7d2373',bg2:'#190a37',snake:'#ff6ed2',snake2:'#ffd25a',head:'#ffdced',food:'#78ffdc',accent:'#ff78e6',ob:'🔺'},
{name:'VƯƠNG QUỐC RẮN',bg:'#23b4aa',bg2:'#194178',snake:'#ffaa46',snake2:'#ff5f8c',head:'#ffebbe',food:'#fff578',accent:'#ffdc64',ob:'🐉'},
{name:'KING SNAKE',bg:'#9650dc',bg2:'#fa73a0',snake:'#ffdc32',snake2:'#ff50a0',head:'#ffffc8',food:'#50ffdc',accent:'#ffffff',ob:'👑'}
];
let snake=[],direction=[1,0],queued=[1,0],food=null,rocks=[],level=0,score=0,got=0,auto=false,running=false,paused=false,gameOver=false,last=0,acc=0,music=false,audio=null,musicTimer=null;
const $=id=>document.getElementById(id),same=(a,b)=>!!a&&!!b&&a[0]===b[0]&&a[1]===b[1],key=p=>p[0]+','+p[1],inside=p=>p[0]>=0&&p[0]<COLS&&p[1]>=0&&p[1]<ROWS;
function tone(freq,duration=.1){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.025,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function musicStart(){if(!music||musicTimer)return;let i=0,notes=[523,659,784,659,587,698,880,698];musicTimer=setInterval(()=>{if(running&&music)tone(notes[i++%notes.length],.12)},220)}
function musicStop(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function target(){return 5+(level*5)}
function placeFood(){let free=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const p=[x,y];if(!snake.some(q=>same(p,q))&&!rocks.some(q=>same(p,q)))free.push(p)}return free.length?free[Math.floor(Math.random()*free.length)]:null}
function makeRocks(){rocks=[];const count=5+level*2;let tries=0;while(rocks.length<count&&tries++<300){const p=[Math.floor(Math.random()*COLS),Math.floor(Math.random()*ROWS)];if(Math.abs(p[0]-snake[0][0])+Math.abs(p[1]-snake[0][1])>5&&!snake.some(q=>same(q,p))&&!rocks.some(q=>same(q,p)))rocks.push(p)}}
function reset(){level=0;score=0;got=0;snake=[[17,10],[16,10],[15,10]];direction=[1,0];queued=[1,0];gameOver=false;paused=false;acc=0;makeRocks();food=placeFood();running=true;overlay.style.display='none';musicStart();draw()}
function pathTo(targetPos){if(!targetPos)return null;const blocked=new Set([...snake.slice(1,-1),...rocks].map(key)),q=[snake[0]],prev=new Map([[key(snake[0]),null]]),step=new Map();for(let i=0;i<q.length;i++){const p=q[i];if(same(p,targetPos))break;for(const d of [[0,-1],[0,1],[-1,0],[1,0]]){const n=[p[0]+d[0],p[1]+d[1]],k=key(n);if(!inside(n)||blocked.has(k)||prev.has(k))continue;prev.set(k,key(p));step.set(k,d);q.push(n)}}let k=key(targetPos);if(!prev.has(k))return null;let first=null;while(prev.get(k)!==null){first=step.get(k);k=prev.get(k)}return first}
function aiDirection(){return pathTo(food)||pathTo(snake[snake.length-1])||[[0,-1],[0,1],[-1,0],[1,0]].find(d=>{const p=[snake[0][0]+d[0],snake[0][1]+d[1]];return inside(p)&&!rocks.some(r=>same(r,p))&&!snake.slice(0,-1).some(q=>same(q,p))})}
function finish(win){running=false;gameOver=true;musicStop();overlay.style.display='flex';overlay.innerHTML='<div class="panel"><h2>'+(win?'🏆 CHIẾN THẮNG!':'GAME OVER')+'</h2><p>'+(win?'Bạn đã hoàn thành cả 10 màn!':'Rắn đã va chạm. Hãy thử lại nhé!')+'<br>Điểm: <b>'+score+'</b></p><div class="controls"><button class="btn" id="again" type="button">↻ CHƠI LẠI</button></div></div>';$('again').addEventListener('click',()=>reset())}
function move(){if(auto){const d=aiDirection();if(d)queued=d}if(queued[0]===-direction[0]&&queued[1]===-direction[1])queued=direction;direction=queued;const head=[snake[0][0]+direction[0],snake[0][1]+direction[1]],eating=same(head,food);if(!inside(head)||rocks.some(p=>same(p,head))||snake.slice(0,eating?snake.length:snake.length-1).some(p=>same(p,head))){finish(false);return}snake.unshift(head);if(eating){score+=10;got++;tone(900,.08);if(got>=target()){if(level===9){finish(true);return}level++;got=0;makeRocks();food=placeFood()}else food=placeFood()}else snake.pop()}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill()}
function draw(){
 const t=themes[level]||themes[0],W=900,H=650;
 const bg=ctx.createLinearGradient(0,100,0,650);bg.addColorStop(0,t.bg);bg.addColorStop(1,t.bg2);ctx.fillStyle=bg;ctx.fillRect(0,100,W,550);
 // Cảnh nền theo chủ đề từng vòng
 ctx.save();ctx.globalAlpha=.20;
 if(level===0){for(let i=0;i<9;i++){let x=35+i*105;ctx.fillStyle='#073b26';ctx.fillRect(x,165,13,430);for(let j=0;j<4;j++){ctx.beginPath();ctx.arc(x+6+(j%2?18:-18),190+j*22,28,0,Math.PI*2);ctx.fill()}}}
 else if(level===1){ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(745,205,75,0,Math.PI*2);ctx.fill();for(let k=0;k<3;k++){ctx.fillStyle=k%2?'#6e2944':'#8c3e55';ctx.beginPath();ctx.moveTo(0,420+k*65);for(let x=0;x<=900;x+=30)ctx.lineTo(x,390+k*65+Math.sin(x*.012+k)*25);ctx.lineTo(900,650);ctx.lineTo(0,650);ctx.fill()}}
 else if(level===2){for(let i=0;i<9;i++){let x=40+i*105;ctx.strokeStyle='#080719';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(x,620);ctx.lineTo(x+Math.sin(i)*30,230+(i%3)*55);ctx.stroke();for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(x,350+j*60);ctx.lineTo(x+(i%2?40:-40),320+j*60);ctx.stroke()}}}
 else if(level===3){for(let i=0;i<18;i++){ctx.fillStyle=i%2?'#ffb02e':'#4b090d';ctx.beginPath();ctx.moveTo(i*55,100);ctx.lineTo(i*55+35,100);ctx.lineTo(i*55+18,190+(i%4)*25);ctx.fill()}for(let i=0;i<8;i++){ctx.fillStyle='#ffb02e';ctx.beginPath();ctx.arc(70+i*110,570,20+(i%3)*9,0,Math.PI*2);ctx.fill()}}
 else if(level===4||level===6){for(let i=0;i<18;i++){let x=(i*71)%900,y=150+(i*97)%450;ctx.fillStyle='#d9ffff';ctx.beginPath();ctx.moveTo(x,y-40);ctx.lineTo(x+18,y);ctx.lineTo(x,y+45);ctx.lineTo(x-17,y);ctx.fill()}}
 else if(level===5){for(let i=0;i<35;i++){ctx.strokeStyle='#fff1c0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo((i*83)%900,150+(i*47)%450);ctx.lineTo((i*83)%900+60,140+(i*47)%450);ctx.stroke()}}
 else if(level===7||level===9){for(let i=0;i<16;i++){ctx.fillStyle=i%2?'#ffb8ec':'#ffe878';ctx.beginPath();ctx.arc((i*137)%900,140+(i*91)%480,8+(i%3)*5,0,Math.PI*2);ctx.fill()}}
 else {for(let i=0;i<12;i++){ctx.fillStyle='#d5fff0';ctx.beginPath();ctx.arc((i*113)%900,160+(i*67)%430,25+(i%3)*10,0,Math.PI*2);ctx.fill()}}
 ctx.restore();
 // Viền cỏ và lưới sân
 ctx.fillStyle='#0b1428';ctx.fillRect(0,100,900,25);ctx.fillRect(0,625,900,25);ctx.fillRect(0,100,25,550);ctx.fillRect(875,100,25,550);
 ctx.strokeStyle='rgba(255,255,255,.16)';ctx.lineWidth=1;
 for(let x=25;x<=875;x+=25){ctx.beginPath();ctx.moveTo(x,125);ctx.lineTo(x,625);ctx.stroke()}
 for(let y=125;y<=625;y+=25){ctx.beginPath();ctx.moveTo(25,y);ctx.lineTo(875,y);ctx.stroke()}
 // Chấm sáng trang trí ở bốn góc
 [[35,135,'#ffe478'],[865,135,'#8ceeff'],[35,615,'#ff83bc'],[865,615,'#a5ffb2']].forEach(([x,y,c])=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,5,0,Math.PI*2);ctx.fill()});
 // Chướng ngại vật
 rocks.forEach((p,i)=>{const x=LEFT+p[0]*CELL+2,y=TOP+p[1]*CELL+2;ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=7;rounded(x,y,21,21,6,level===4||level===6?'#c9f7ff':'#3a3445');ctx.shadowBlur=0;ctx.font='16px Arial';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(t.ob,x+10.5,y+17);ctx.restore()});
 // Mồi viên đạn kim loại, có đầu nhọn và viền sáng
 if(food){const x=LEFT+food[0]*CELL+12.5,y=TOP+food[1]*CELL+12.5;ctx.save();ctx.translate(x,y);ctx.shadowColor=t.food;ctx.shadowBlur=15;ctx.fillStyle=t.food;ctx.beginPath();ctx.moveTo(-7,3);ctx.lineTo(-6,-5);ctx.lineTo(-2,-12);ctx.lineTo(0,-15);ctx.lineTo(3,-11);ctx.lineTo(7,-4);ctx.lineTo(7,5);ctx.lineTo(5,9);ctx.lineTo(-5,9);ctx.closePath();ctx.fill();ctx.shadowBlur=0;rounded(-6,2,12,12,3,'#9da9bd');ctx.fillStyle='#fff';ctx.fillRect(-4,-4,2,9);ctx.fillStyle='#59677c';ctx.fillRect(3,3,2,8);ctx.restore()}
 // Rắn: thân có viền, chuyển sắc hai màu, đầu có mắt
 snake.forEach((p,i)=>{const x=LEFT+p[0]*CELL+2,y=TOP+p[1]*CELL+2;ctx.save();ctx.shadowColor=i===0?t.head:t.snake;ctx.shadowBlur=i===0?13:5;rounded(x,y,21,21,i===0?8:7,i===0?t.head:(i%2?t.snake:t.snake2));ctx.shadowBlur=0;if(i!==0){ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=1.2;ctx.strokeRect(x+2,y+2,17,17);ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x+5,y+4,4,3)}else{ctx.fillStyle='#20202b';let ex=x+10-direction[1]*4,ey=y+10+direction[0]*4;ctx.beginPath();ctx.arc(ex-direction[0]*4-direction[1]*3,ey-direction[1]*4+direction[0]*3,2.5,0,Math.PI*2);ctx.arc(ex-direction[0]*4+direction[1]*3,ey-direction[1]*4-direction[0]*3,2.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+7,y+6,2,0,Math.PI*2);ctx.fill()}ctx.restore()});
 // Tên người chơi nổi trên đầu rắn
 if(snake.length){const p=snake[0],x=LEFT+p[0]*CELL+12,y=TOP+p[1]*CELL-5;ctx.font='bold 15px Arial';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#111';ctx.strokeText('HKHẢI',x,y);ctx.fillStyle='#fff';ctx.fillText('HKHẢI',x,y)}
 // HUD kiểu SNAKE ADVENTURE của bản gốc
 ctx.fillStyle='#0c1024';ctx.fillRect(0,0,900,100);ctx.fillStyle='#46beff';ctx.fillRect(0,97,900,3);
 ctx.textAlign='center';ctx.font='bold 36px Arial';ctx.shadowColor='#45dfff';ctx.shadowBlur=12;ctx.fillStyle='#64e6ff';ctx.fillText('SNAKE ADVENTURE',450,39);ctx.shadowBlur=0;
 ctx.font='bold 19px Arial';ctx.fillStyle='#ffdc50';ctx.fillText('VÒNG: '+(level+1)+'/10',125,77);ctx.fillStyle='#64ff96';ctx.fillText('ĐIỂM: '+score,350,77);ctx.fillStyle='#ff9b78';ctx.fillText('MỒI: '+got+'/'+target(),590,77);ctx.font='bold 14px Arial';ctx.fillStyle=auto?'#62ff8b':'#b7bdca';ctx.fillText('AUTO: '+(auto?'ON':'OFF'),810,25);
 ctx.textAlign='left';ctx.font='bold 14px Arial';ctx.fillStyle='#fff';ctx.fillText(t.name,32,119);
 ctx.fillStyle='#fff';ctx.font='13px Arial';ctx.fillText('HKHẢI  •  KING SNAKE',18,644);
}
function frame(ts){const dt=Math.min(50,ts-(last||ts));last=ts;if(running&&!paused){acc+=dt;const speed=Math.min(16,7+level*.7);if(acc>=1000/speed){acc=0;move()}}draw();requestAnimationFrame(frame)}
function setDirection(d){if(d&&!(d[0]===-direction[0]&&d[1]===-direction[1])){queued=d;auto=false;sync()}}
function sync(){$('auto').textContent='🤖 AUTO: '+(auto?'ON':'OFF')+' (M)';$('music').textContent='♫ NHẠC: '+(music?'ON':'OFF')+' (N)'}
$('start').addEventListener('click',()=>{auto=false;reset();sync()});$('autoStart').addEventListener('click',()=>{auto=true;reset();sync()});$('auto').addEventListener('click',()=>{auto=!auto;sync()});$('music').addEventListener('click',()=>{music=!music;if(music)musicStart();else musicStop();sync()});$('restart').addEventListener('click',()=>reset());
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDirection(b.dataset.dir.split(',').map(Number))));
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),map={'arrowup':[0,-1],w:[0,-1],'arrowdown':[0,1],s:[0,1],'arrowleft':[-1,0],a:[-1,0],'arrowright':[1,0],d:[1,0]};if(map[k]){e.preventDefault();setDirection(map[k])}if(k==='m'){auto=!auto;sync()}if(k==='n'){$('music').click()}if(k==='r')reset();if(k==='escape'&&running){paused=!paused;overlay.style.display=paused?'flex':'none';if(paused){overlay.innerHTML='<div class="panel"><h2>TẠM DỪNG</h2><button class="btn" id="resume" type="button">TIẾP TỤC</button></div>';$('resume').addEventListener('click',()=>{paused=false;overlay.style.display='none'})}}});
sync();requestAnimationFrame(frame);
})();
</script></body></html>
